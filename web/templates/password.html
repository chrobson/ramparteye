{{define "title"}}Change password{{end}}
{{define "content"}}<div class="max-w-md">
<form method="post" action="/account/password" class="panel space-y-4 p-5">
<h1 class="text-base font-semibold">Change password</h1>
{{if .Data.Forced}}<p class="text-muted">You must set a new password before you continue.</p>{{end}}
{{with .Data.Error}}<p class="alert-error" role="alert">{{.}}</p>{{end}}
<label class="block"><span class="lbl">Current password</span>
<input class="input mt-1" type="password" name="current" autocomplete="current-password" required></label>
<label class="block"><span class="lbl">New password (8 to 72 characters)</span>
<input class="input mt-1" type="password" name="new" autocomplete="new-password" minlength="8" maxlength="72" required></label>
<label class="block"><span class="lbl">Repeat the new password</span>
<input class="input mt-1" type="password" name="confirm" autocomplete="new-password" minlength="8" maxlength="72" required></label>
<button type="submit" class="btn btn-primary w-full justify-center">Save password</button>
</form>
{{if .Data.Forced}}<form method="post" action="/logout" class="mt-3 text-center"><button type="submit" class="text-muted underline hover:text-fg">Sign out</button></form>{{end}}
</div>{{end}}
