{{/* Confirm dialog used by forms with data-confirm (and optional data-confirm-ok) via app.js. */}}
{{define "confirm-dialog"}}<dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title">
<form method="dialog">
<h2 id="confirm-title" class="font-semibold">Please confirm</h2>
<p class="mt-2 text-muted" data-confirm-text></p>
<div class="mt-4 flex justify-end gap-2">
<button type="submit" value="cancel" class="btn">Back</button>
<button type="submit" value="ok" class="btn btn-primary" data-confirm-ok>Confirm</button>
</div>
</form>
</dialog>{{end}}
