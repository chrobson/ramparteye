{{/* Status chip. Data: Chip{Text, Kind (chip-ok|chip-bad|chip-off), Href}. */}}
{{define "chip"}}{{if .Href}}<a href="{{.Href}}" class="chip {{.Kind}}">{{template "chip-body" .}}</a>{{else}}<span class="chip {{.Kind}}">{{template "chip-body" .}}</span>{{end}}{{end}}
{{define "chip-body"}}{{if eq .Kind "chip-ok"}}<span aria-hidden="true">●</span>{{else if eq .Kind "chip-bad"}}<span aria-hidden="true">▲</span>{{end}}{{.Text}}{{end}}
