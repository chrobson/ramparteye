name: e2e
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lab ground truth is fresh
        run: python3 lab/gen_expected.py --check
      # Builds the image, starts the demo stack with the bundled lab and runs
      # three scans with lab changes in between (scripts/e2e.sh).
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          # Not the login cookie jars.
          path: |
            tmp/e2e
            !tmp/e2e/*.jar
