name: e2e
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: lab ground truth is fresh
        run: python3 lab/gen_expected.py --check
      # Builds the image, starts the demo stack with the bundled lab and runs
      # three scans with lab changes in between (scripts/e2e.sh).
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          # Not the login cookie jars.
          path: |
            tmp/e2e
            !tmp/e2e/*.jar
