name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go vet ./...
      - run: go test ./...
      - run: make css-check
      # Pinned so a new govulncheck release cannot break CI by itself; the Go
      # toolchain comes from the toolchain line in go.mod (standard library
      # advisories are fixed by patch releases).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: shellcheck install.sh scripts/*.sh lab/*.sh tools/*.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Percona PostgreSQL needs shared_preload_libraries=pg_tde and the
      # init script from deploy/db/init, which a services: container cannot
      # get, so tools/test-db.sh starts it after checkout.
      - run: make test-integration
