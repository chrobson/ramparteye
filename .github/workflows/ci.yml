name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go vet ./...
      - run: go test ./...
      - run: make css-check
      - run: shellcheck install.sh scripts/*.sh lab/*.sh tools/*.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Percona PostgreSQL needs shared_preload_libraries=pg_tde and the
      # init script from deploy/db/init, which a services: container cannot
      # get, so tools/test-db.sh starts it after checkout.
      - run: make test-integration
