name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make css-check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: percona/percona-distribution-postgresql:18.7.1-1
        env:
          POSTGRES_USER: rampart
          POSTGRES_PASSWORD: rampart
          POSTGRES_DB: rampart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rampart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAMPART_TEST_DATABASE_URL: postgres://rampart:rampart@localhost:5432/rampart?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration ./...
