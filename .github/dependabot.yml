version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    # The demo lab pins exact versions on purpose: they are the scan ground
    # truth in lab/gen_expected.py and lab/README.md.
    exclude-paths:
      - "compose.demo.yml"
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major needs pg_upgrade on the pgdata volume; do it by hand.
      - dependency-name: "percona/percona-distribution-postgresql"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-compose:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod:
        patterns: ["*"]
