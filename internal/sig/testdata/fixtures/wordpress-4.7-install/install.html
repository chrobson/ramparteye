<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
<head>
	<meta name="viewport" content="width=device-width" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>WordPress &rsaquo; Installation</title>
	<link rel='stylesheet' id='dashicons-css'  href='http://127.0.0.1:8090/wp-includes/css/dashicons.min.css?ver=4.7' type='text/css' media='all' />
<link rel='stylesheet' id='buttons-css'  href='http://127.0.0.1:8090/wp-includes/css/buttons.min.css?ver=4.7' type='text/css' media='all' />
<link rel='stylesheet' id='forms-css'  href='http://127.0.0.1:8090/wp-admin/css/forms.min.css?ver=4.7' type='text/css' media='all' />
<link rel='stylesheet' id='l10n-css'  href='http://127.0.0.1:8090/wp-admin/css/l10n.min.css?ver=4.7' type='text/css' media='all' />
<link rel='stylesheet' id='install-css'  href='http://127.0.0.1:8090/wp-admin/css/install.min.css?ver=4.7' type='text/css' media='all' />
<script type='text/javascript' src='http://127.0.0.1:8090/wp-includes/js/jquery/jquery.js?ver=1.12.4'></script>
</head>
<body class="wp-core-ui language-chooser">
<p id="logo"><a href="https://wordpress.org/" tabindex="-1">WordPress</a></p>
<form id="setup" method="post" action="?step=1"><label class='screen-reader-text' for='language'>Select a default language</label>
<select size='14' name='language' id='language'>
<option value="" lang="en" selected="selected" data-continue="Continue" data-installed="1">English (United States)</option>
<option value="pl_PL" lang="pl" data-continue="Dalej">Polski</option>
</select>
<p class="step"><span class="spinner"></span><input id="language-continue" type="submit" class="button button-primary button-large" value="Continue" /></p></form>
</body>
</html>
