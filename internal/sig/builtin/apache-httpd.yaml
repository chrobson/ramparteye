id: apache-httpd
name: Apache HTTP Server
category: server
confidence: 85
description: Apache httpd web server (Server header or nmap product).
condition: or
cwe: [497]
remediation: 'Hide the server version (ServerTokens Prod, ServerSignature Off) and keep Apache on a supported release.'
matchers:
  - type: header
    name: Server
    regex: '^Apache(?:/(?P<version>[0-9.]+))?'
  - type: service
    product: 'Apache httpd'
