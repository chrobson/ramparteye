id: tomcat
name: Apache Tomcat
category: server
confidence: 85
description: Apache Tomcat servlet container (default page, error page or nmap product).
condition: or
cwe: [497]
remediation: 'Hide the Tomcat version on error pages (ErrorReportValve showServerInfo=false) and keep Tomcat on a supported release.'
matchers:
