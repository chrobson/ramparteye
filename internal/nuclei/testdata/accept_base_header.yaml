id: Nginx_Detect.v1
info:
  name: Nginx Detect
  severity: info
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: word
        part: header
        words:
          - "Server: nginx"
      - type: word
        part: body
        words:
          - "Welcome to nginx"
        case-insensitive: true
