  tomcat-manager-context:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Manager app reachable from any address (default image restricts it to localhost). -->
      <Context antiResourceLocking="false" privileged="true">
        <Manager sessionAttributeValueClassNameFilter="java\.lang\.(?:Boolean|Integer|Long|Number|String)|org\.apache\.catalina\.filters\.CsrfPreventionFilter\$$LruCache(?:\$$1)?|java\.util\.(?:Linked)?HashMap"/>
      </Context>
  tomcat-users:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Lab-only credentials: tomcat / tomcat (classic default) -->
      <tomcat-users xmlns="http://tomcat.apache.org/xml" version="1.0">
        <role rolename="manager-gui"/>
        <user username="tomcat" password="tomcat" roles="manager-gui"/>
      </tomcat-users>
  haproxy-cfg:
    content: |
      global
          log stdout format raw local0
      defaults
          mode http
          timeout connect 5s
          timeout client 30s
          timeout server 30s
      frontend web
          bind :80
          stats enable
          stats uri /haproxy?stats
          # everything except the stats page gets a fixed landing page (stats stay reachable)
          http-request return status 200 content-type text/html string "<html><head><title>Load balancer</title></head><body>lb ok</body></html>" unless { path /haproxy }
  corefile:
    content: |
      # timeouts: CoreDNS closes an idle TCP connection after 3 s by default, which is exactly nmap's
      # "tcpwrapped" threshold for the NULL probe, so -sV flipped between "NLnet Labs NSD" and
      # "tcpwrapped". With 10 s the NULL probe times out cleanly and the DNS probe always answers.
      lab.local:53 {
          timeouts {
              read 10s
              idle 15s
          }
          hosts {
              10.20.0.10 www.lab.local lab.local staging.lab.local
              10.20.0.11 secure.lab.local
              10.20.1.20 blog.lab.local
              10.20.2.40 jenkins.lab.local
              10.20.3.50 grafana.lab.local
              10.20.5.70 git.lab.local
              10.20.9.110 app.lab.local
              10.20.56.110 old.lab.local
              fallthrough
          }
      }
      .:53 {
          timeouts {
              read 10s
              idle 15s
          }
          errors
      }
  mosquitto-conf:
    content: |
      listener 1883
      allow_anonymous true
      persistence false
      log_dest stdout
  banner:
    content: |
      #!/bin/sh
      # banner.sh PORT TEXT... : tiny fake TCP service that sends one banner line (CRLF) and then
      # swallows client input for up to 10 s. Used for services that only need a recognisable banner.
      port="$$1"; shift
      printf '%s\r\n' "$$*" > /tmp/banner
      exec socat TCP-LISTEN:"$$port",fork,reuseaddr SYSTEM:'cat /tmp/banner; timeout 10 cat >/dev/null'
  telnet-banner:
    content: |
      #!/bin/sh
      # Fake "IoT router" telnet service (10.20.24.30:23): sends the BusyBox telnetd option negotiation and
      # a login prompt as ONE write, then swallows client input for up to 10 s.
      # Why not the real busybox telnetd: it sends the IAC bytes and the "\r\r\n<host> login: " prompt in
      # separate writes that race each other, so `nmap -sV` reported version "" in some scans and
      # "1.14.0 or later" in others (soft match on a partial read). That flake shows up as a false
      # "changed" between runs. With one write nmap always reports product "BusyBox telnetd", version "".
      port="$${1:-23}"
      printf '\377\375\001\377\375\037\377\373\001\377\373\003\r\r\nrouter login: ' > /tmp/telnet-banner
      exec socat TCP-LISTEN:"$$port",fork,reuseaddr SYSTEM:'cat /tmp/telnet-banner; timeout 10 cat >/dev/null'
