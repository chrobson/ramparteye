# RampartEye demo: the app joins a bundled scan lab (internal network "lab",
# 10.20.0.0/18, about 30 targets on fixed addresses) instead of the host
# network, with the four demo accounts (RAMPART_DEMO=1) and the lab as its
# only scope. Use it on top of compose.yml:
#   docker compose -f compose.yml -f compose.demo.yml up -d
# install.sh --demo writes COMPOSE_FILE to .env so plain `docker compose`
# commands use both files. Self-contained: every lab file is inlined below.
# The lab variants (lab/variants/run2.yml, run3.yml) change the lab between
# scans; lab/expected/runN.json is the ground truth (lab/README.md).
#
# The lab needs about 1.5 GiB RAM and pulls about 20 images. Scan ONLY this
# network. Needs Docker Compose 2.24 or later.
# 10.20.0.0/18 is fixed: it must not overlap a network this docker host
# already uses (your LAN, a VPN or another docker network), and only one demo
# stack can run per docker host. If it collides, change the subnet, every lab
# address below and lab/expected (lab/gen_expected.py) together.

x-targets: &targets
  image: ramparteye-lab-targets:local
  build:
    context: .
    # Minimal multi-purpose target image: OpenSSH server, socat (fake
    # banners), busybox-extras (httpd). One image, many small hosts.
    dockerfile_inline: |
      FROM alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
      RUN apk add --no-cache openssh-server socat busybox-extras \
       && ssh-keygen -A \
       && adduser -D -s /bin/sh lab \
       && echo 'lab:lab' | chpasswd \
       && sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
      CMD ["/usr/sbin/sshd", "-D", "-e"]
  restart: unless-stopped

x-busybox: &busybox
  image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
  restart: unless-stopped

networks:
  lab:
    driver: bridge
    # No route out of the lab: the targets reach only each other and the app.
    internal: true
    ipam:
      config:
        - subnet: 10.20.0.0/18
          gateway: 10.20.0.1

services:
  # ------------------------------------------------------------- RampartEye
  app:
    # Lab network instead of the host network (compose.yml).
    network_mode: !reset null
    # Adds the lab targets and the scan profile "Demo", then serves.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ramparteye seed-demo 10.20.0.0/18 staging.lab.local
        || echo "seed-demo failed: add the lab targets on the Targets page" >&2;
        exec ramparteye serve
    environment:
      RAMPART_DATABASE_URL: postgres://ramparteye:${RAMPART_DB_PASSWORD}@db:5432/ramparteye?sslmode=disable
      RAMPART_HTTP_ADDR: ":9080"
      RAMPART_DEMO: "1"
      RAMPART_ALLOWED_CIDRS: 10.20.0.0/18
      # Network address, docker gateway and this app.
      RAMPART_SCAN_EXCLUDE: 10.20.0.0,10.20.0.1,10.20.63.251
      # SYN scan and ARP discovery: the nmap copy with file capabilities,
      # which needs NET_RAW and NET_ADMIN (cap_add below).
      RAMPART_SCAN_PRIVILEGED: "true"
      RAMPART_NMAP_PATH: /usr/local/bin/nmap-privileged
      NMAP_PRIVILEGED: "1"
    cap_add: [NET_RAW, NET_ADMIN]
    # nmap-privileged gets its file capabilities only without
    # no-new-privileges (cap_drop ALL from compose.yml stays).
    security_opt: !reset []
    # Lab names for the vhost probe (the lab CoreDNS at 10.20.48.90 serves
    # the same names; it stays a scan target, not the app's resolver).
    extra_hosts:
      - "staging.lab.local:10.20.0.10"
      - "www.lab.local:10.20.0.10"
      - "secure.lab.local:10.20.0.11"
      - "old.lab.local:10.20.56.110"
    ports:
      - "${RAMPART_BIND:-127.0.0.1}:${RAMPART_PORT:-9080}:9080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9080/healthz || exit 1"]
    networks:
      default: {}
      lab:
        ipv4_address: 10.20.63.251

  db:
    # The app reaches the database on the compose network.
    ports: !reset []

  # ------------------------------------------------------------- web
  nginx-web:            # public site + staging vhost (Host: staging.lab.local)
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    configs:
      - { source: nginx-web-conf, target: /etc/nginx/conf.d/default.conf }
      - { source: www-nginx-web, target: /srv/www/index.html }
      - { source: www-staging, target: /srv/staging/index.html }
    networks:
      lab: { ipv4_address: 10.20.0.10 }
    restart: unless-stopped

  nginx-tls:            # 80 -> 301 https, 443 self-signed (CN=secure.lab.local)
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    configs:
      - { source: nginx-tls-conf, target: /etc/nginx/conf.d/default.conf }
      - { source: tls-secure-crt, target: /etc/nginx/tls/secure.crt }
      - { source: tls-secure-key, target: /etc/nginx/tls/secure.key }
    networks:
      lab: { ipv4_address: 10.20.0.11 }
    restart: unless-stopped

  wordpress:
    image: wordpress:7.1.5-php8.2-apache@sha256:fbb66b2aa8d225f7d2158c47aba782157bd7e1a5a79d05f9adf30c85d85da7e9
    environment:
      WORDPRESS_DB_HOST: 10.20.1.21
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-lab-pass
      WORDPRESS_DB_NAME: wordpress
    depends_on: [wp-db]
    networks:
      lab: { ipv4_address: 10.20.1.20 }
    restart: unless-stopped

  wp-db:
    image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MARIADB_ROOT_PASSWORD: root-lab-pass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-lab-pass
    networks:
      lab: { ipv4_address: 10.20.1.21 }
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache@sha256:64293e1f91d6509e9530d51059b1d45a31d3e4b38ead27cc9648b915b061ba2c
    environment:
      PMA_HOST: 10.20.1.21
    networks:
      lab: { ipv4_address: 10.20.1.30 }
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:2.541.3-lts-jdk17@sha256:cce1eeb79902722f3cf7a8831c41e95c39f4a42b9a2981959630cc66539b3c2d
    environment:
      JAVA_OPTS: "-Xmx384m -Djenkins.install.runSetupWizard=false"
    networks:
      lab: { ipv4_address: 10.20.2.40 }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      lab: { ipv4_address: 10.20.3.50 }
    restart: unless-stopped

  tomcat:               # Tomcat 9 with the manager app reachable remotely (tomcat/tomcat)
    image: tomcat:11.0.29-jre17@sha256:da2fc7829c9b59c3da93ecf4fbc0789c3d4189f3625b2d30223398a654490824
    command:
      - sh
      - -c
      - >-
        cp -r /usr/local/tomcat/webapps.dist/ROOT /usr/local/tomcat/webapps.dist/manager /usr/local/tomcat/webapps/ &&
        cp /lab/manager-context.xml /usr/local/tomcat/webapps/manager/META-INF/context.xml &&
        cp /lab/tomcat-users.xml /usr/local/tomcat/conf/tomcat-users.xml &&
        exec catalina.sh run
    environment:
      CATALINA_OPTS: "-Xmx192m"
    configs:
      - { source: tomcat-manager-context, target: /lab/manager-context.xml }
      - { source: tomcat-users, target: /lab/tomcat-users.xml }
    networks:
      lab: { ipv4_address: 10.20.4.60 }
    restart: unless-stopped

  gitea:                # another web UI: web 3000 + built-in OpenSSH 22
    image: gitea/gitea:28.4.0@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: git.lab.local
    networks:
      lab: { ipv4_address: 10.20.5.70 }
    restart: unless-stopped

  admin-app:            # simple app with /login form and /admin (401 Basic)
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    configs:
      - { source: admin-app-conf, target: /etc/nginx/conf.d/default.conf }
      - { source: admin-app-htpasswd, target: /etc/nginx/admin.htpasswd }
      - { source: www-admin-app-index, target: /srv/www/index.html }
      - { source: www-admin-app-login, target: /srv/www/login.html }
      - { source: www-admin-app-admin, target: /srv/www/admin.html }
    networks:
      lab: { ipv4_address: 10.20.9.110 }
    restart: unless-stopped

  apache:               # version changes between runs (lab/variants)
    image: httpd:2.4.71-alpine@sha256:32bd0639bcc4917ef1fd9363a1d9dd2dd9c498565118b062a10d51e43a5c3a24
    networks:
      lab: { ipv4_address: 10.20.40.70 }
    restart: unless-stopped

  adminer:
    image: adminer:5.5.1@sha256:4612622919c7026538bb4cc87a10254f96d5a8c254dfcc4d8896064af06c5517
    networks:
      lab: { ipv4_address: 10.20.44.80 }
    restart: unless-stopped

  haproxy:
    image: haproxy:3.4.8-alpine@sha256:8aa6458a9d22a8364a2d2ee9ce93de0cc4a2789e3cf63f0b44adc972863724d7
    configs:
      - { source: haproxy-cfg, target: /usr/local/etc/haproxy/haproxy.cfg }
    networks:
      lab: { ipv4_address: 10.20.52.100 }
    restart: unless-stopped

  web-8443:             # HTTPS on 8443 with an expired self-signed certificate
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    configs:
      - { source: web-8443-conf, target: /etc/nginx/conf.d/default.conf }
      - { source: tls-expired-crt, target: /etc/nginx/tls/expired.crt }
      - { source: tls-expired-key, target: /etc/nginx/tls/expired.key }
    networks:
      lab: { ipv4_address: 10.20.56.110 }
    restart: unless-stopped

  # ------------------------------------------------------------- infra / data
  sshd:
    <<: *targets
    networks:
      lab: { ipv4_address: 10.20.6.80 }

  mysql:
    image: mysql:26.10.0.1@sha256:9092489f49fb59c4ba6c1425c6a59f71f864f24bf4339a5a26b718adc7a8b343
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: root-lab-pass
    networks:
      lab: { ipv4_address: 10.20.7.90 }
    restart: unless-stopped

  postgres:
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    environment:
      POSTGRES_PASSWORD: pg-lab-pass
    networks:
      lab: { ipv4_address: 10.20.10.120 }
    restart: unless-stopped

  redis:
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    networks:
      lab: { ipv4_address: 10.20.11.130 }
    restart: unless-stopped

  nats:
    image: nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    command: ["-m", "8222"]
    networks:
      lab: { ipv4_address: 10.20.12.140 }
    restart: unless-stopped

  memcached:            # removed in run2 / run3
    image: memcached:1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
    networks:
      lab: { ipv4_address: 10.20.36.60 }
    restart: unless-stopped

  coredns:              # DNS for lab.local names (incl. staging.lab.local)
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    command: ["-conf", "/etc/coredns/Corefile"]
    configs:
      - { source: corefile, target: /etc/coredns/Corefile }
    networks:
      lab: { ipv4_address: 10.20.48.90 }
    restart: unless-stopped

  # ------------------------------------------------------------- IoT
  mosquitto:            # MQTT broker, anonymous access
    image: eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
    configs:
      - { source: mosquitto-conf, target: /mosquitto/config/mosquitto.conf }
    networks:
      lab: { ipv4_address: 10.20.8.100 }
    restart: unless-stopped

  telnet-iot:           # "IoT router": telnet 23 + web management 80 (telnet closed in run2/run3)
    <<: *targets
    command: ["sh", "-c", "busybox-extras httpd -p 80 -h /www && exec /lab/telnet-banner.sh 23"]
    configs:
      - { source: www-telnet-iot, target: /www/index.html }
      - { source: telnet-banner, target: /lab/telnet-banner.sh, mode: 0555 }
    networks:
      lab: { ipv4_address: 10.20.24.30 }

  ipcam:                # "IP camera" web UI
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    configs:
      - { source: www-ipcam, target: /www/index.html }
    networks:
      lab: { ipv4_address: 10.20.32.50 }

  # ------------------------------------------------------------- minimal hosts
  bb-http:              # gains port 8000 in run2 / run3
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    configs:
      - { source: www-bb-http, target: /www/index.html }
    networks:
      lab: { ipv4_address: 10.20.16.10 }

  bb-http-alt:
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    configs:
      - { source: www-bb-http-alt, target: /www/index.html }
    networks:
      lab: { ipv4_address: 10.20.16.11 }

  ftp-banner:
    <<: *targets
    command: ["/lab/banner.sh", "21", "220 (vsFTPd 3.0.3)"]
    configs:
      - { source: banner, target: /lab/banner.sh, mode: 0555 }
    networks:
      lab: { ipv4_address: 10.20.20.20 }

  smtp-banner:          # banner changes in run3 (Postfix -> Exim)
    <<: *targets
    command: ["/lab/banner.sh", "25", "220 mail.lab.local ESMTP Postfix (Debian/GNU)"]
    configs:
      - { source: banner, target: /lab/banner.sh, mode: 0555 }
    networks:
      lab: { ipv4_address: 10.20.20.21 }

  legacy-ssh:           # old OpenSSH banner; "upgraded" in run2
    <<: *targets
    command: ["/lab/banner.sh", "22", "SSH-2.0-OpenSSH_7.4"]
    configs:
      - { source: banner, target: /lab/banner.sh, mode: 0555 }
    networks:
      lab: { ipv4_address: 10.20.28.40 }

  flappy:               # unstable host: up in run1, gone in run2, back in run3
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    configs:
      - { source: www-flappy, target: /www/index.html }
    networks:
      lab: { ipv4_address: 10.20.60.120 }

# Lab files. "$$" is a literal "$" (compose interpolates "$").
configs:
  nginx-web-conf:
    content: |
      # nginx-web (10.20.0.10): public site + "staging" virtual host selected by Host header.
      server {
          listen 80 default_server;
          server_name www.lab.local lab.local _;
          root /srv/www;
          index index.html;
      }
      server {
          listen 80;
          server_name staging.lab.local;
          root /srv/staging;
          index index.html;
          add_header X-Environment staging always;
      }
  nginx-tls-conf:
    content: |
      # nginx-tls (10.20.0.11): HTTP->HTTPS redirect + self-signed certificate (CN=secure.lab.local).
      server {
          listen 80 default_server;
          return 301 https://$$host$$request_uri;
      }
      server {
          listen 443 ssl default_server;
          server_name secure.lab.local;
          ssl_certificate     /etc/nginx/tls/secure.crt;
          ssl_certificate_key /etc/nginx/tls/secure.key;
          location / { default_type text/html; return 200 "<html><head><title>ACME Secure Portal</title></head><body><h1>ACME Secure Portal</h1></body></html>\n"; }
      }
  admin-app-conf:
    content: |
      # admin-app (10.20.9.110): simple app exposing /login (form) and /admin (HTTP Basic, 401).
      server {
          listen 80 default_server;
          root /srv/www;
          index index.html;
          location = /login { default_type text/html; try_files /login.html =404; }
          location /admin {
              auth_basic "Admin Panel";
              auth_basic_user_file /etc/nginx/admin.htpasswd;
              default_type text/html;
              try_files /admin.html =404;
          }
      }
  admin-app-htpasswd:
    content: |
      admin:$$apr1$$PNh6jLVh$$MK6fu.gc9Maf7m4EkkGEV/
  web-8443-conf:
    content: |
      # web-8443 (10.20.56.110): HTTPS on 8443 with an EXPIRED self-signed certificate (CN=old.lab.local, 2020-2021).
      server {
          listen 8443 ssl default_server;
          server_name old.lab.local;
          ssl_certificate     /etc/nginx/tls/expired.crt;
          ssl_certificate_key /etc/nginx/tls/expired.key;
          location / { default_type text/html; return 200 "<html><head><title>Legacy Reporting</title></head><body><h1>Legacy Reporting</h1></body></html>\n"; }
